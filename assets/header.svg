<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250"
     font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.20"/>
    </filter>
    <!-- CRT scanlines -->
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.14"/>
    </pattern>
    <clipPath id="screen"><rect x="6" y="44" width="808" height="200" rx="0"/></clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="6" y="6" width="808" height="238" rx="14" fill="url(#bg)" stroke="#22303f" stroke-width="1.5" filter="url(#glow)"/>

  <!-- title bar -->
  <rect x="6" y="6" width="808" height="38" rx="14" fill="#161b22"/>
  <rect x="6" y="30" width="808" height="14" fill="#161b22"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="25" r="6" fill="#27c93f"/>
  <text x="410" y="29" text-anchor="middle" fill="#6e7d90" font-size="13">imran@vezran: ~/security</text>
  <!-- pulsing "online" indicator -->
  <circle cx="698" cy="25" r="4.5" fill="#27c93f">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="712" y="29" fill="#6e7d90" font-size="12">online</text>

  <!-- boot sequence -->
  <g font-size="17">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.25s" fill="freeze"/>
      <text x="28" y="86"><tspan fill="#22d3ee">imran@vezran</tspan><tspan fill="#6e7d90">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.25s" fill="freeze"/>
      <text x="28" y="116" fill="#adbac7">&#8594; Imran Ahamed &#183; Co-Founder &amp; Head of AI/ML @ Vezran</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.25s" fill="freeze"/>
      <text x="28" y="150"><tspan fill="#22d3ee">imran@vezran</tspan><tspan fill="#6e7d90">:~$ </tspan><tspan fill="#e6edf3">cat mission.txt</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.5s" dur="0.25s" fill="freeze"/>
      <text x="28" y="180" fill="#adbac7">&#8594; Build agentic AI that closes threats &#8212; and proves it.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.3s" dur="0.25s" fill="freeze"/>
      <text x="28" y="214"><tspan fill="#22d3ee">imran@vezran</tspan><tspan fill="#6e7d90">:~$ </tspan></text>
      <rect x="194" y="200" width="10" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- scanline overlay (clipped to screen area) -->
  <rect x="6" y="44" width="808" height="200" fill="url(#scan)" clip-path="url(#screen)" pointer-events="none"/>
</svg>
